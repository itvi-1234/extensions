apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition

metadata:
  id: https://runtimeconditions.io/extensions/aws-s3/v1alpha1/runtimeconditions.extension.yaml

spec:
  kinds:
    - name: aws.s3

  interfaceTypes:
    - name: bucket
      targetKind: aws.s3
    - name: service
      targetKind: aws.s3
    - name: object_lambda
      targetKind: aws.s3

  interfaceFields:
    - name: operations
      targetKind: aws.s3
      targetType: bucket
    - name: operations
      targetKind: aws.s3
      targetType: service
    - name: operations
      targetKind: aws.s3
      targetType: object_lambda

  fieldValues:
    - field: interface.operations[].name
      targetKind: aws.s3
      targetType: bucket
      values: &bucket_operations
        - AbortMultipartUpload
        - CompleteMultipartUpload
        - CopyObject
        - CreateBucketMetadataConfiguration
        - CreateBucketMetadataTableConfiguration
        - CreateMultipartUpload
        - CreateSession
        - DeleteBucket
        - DeleteBucketAnalyticsConfiguration
        - DeleteBucketCors
        - DeleteBucketEncryption
        - DeleteBucketIntelligentTieringConfiguration
        - DeleteBucketInventoryConfiguration
        - DeleteBucketLifecycle
        - DeleteBucketMetadataConfiguration
        - DeleteBucketMetadataTableConfiguration
        - DeleteBucketMetricsConfiguration
        - DeleteBucketOwnershipControls
        - DeleteBucketPolicy
        - DeleteBucketReplication
        - DeleteBucketTagging
        - DeleteBucketWebsite
        - DeleteObject
        - DeleteObjectAnnotation
        - DeleteObjects
        - DeleteObjectTagging
        - DeletePublicAccessBlock
        - GetBucketAbac
        - GetBucketAccelerateConfiguration
        - GetBucketAcl
        - GetBucketAnalyticsConfiguration
        - GetBucketCors
        - GetBucketEncryption
        - GetBucketIntelligentTieringConfiguration
        - GetBucketInventoryConfiguration
        - GetBucketLifecycle
        - GetBucketLifecycleConfiguration
        - GetBucketLocation
        - GetBucketLogging
        - GetBucketMetadataConfiguration
        - GetBucketMetadataTableConfiguration
        - GetBucketMetricsConfiguration
        - GetBucketNotification
        - GetBucketNotificationConfiguration
        - GetBucketOwnershipControls
        - GetBucketPolicy
        - GetBucketPolicyStatus
        - GetBucketReplication
        - GetBucketRequestPayment
        - GetBucketTagging
        - GetBucketVersioning
        - GetBucketWebsite
        - GetObject
        - GetObjectAcl
        - GetObjectAnnotation
        - GetObjectAttributes
        - GetObjectLegalHold
        - GetObjectLockConfiguration
        - GetObjectRetention
        - GetObjectTagging
        - GetObjectTorrent
        - GetPublicAccessBlock
        - HeadBucket
        - HeadObject
        - ListBucketAnalyticsConfigurations
        - ListBucketIntelligentTieringConfigurations
        - ListBucketInventoryConfigurations
        - ListBucketMetricsConfigurations
        - ListMultipartUploads
        - ListObjectAnnotations
        - ListObjects
        - ListObjectsV2
        - ListObjectVersions
        - ListParts
        - PutBucketAbac
        - PutBucketAccelerateConfiguration
        - PutBucketAcl
        - PutBucketAnalyticsConfiguration
        - PutBucketCors
        - PutBucketEncryption
        - PutBucketIntelligentTieringConfiguration
        - PutBucketInventoryConfiguration
        - PutBucketLifecycle
        - PutBucketLifecycleConfiguration
        - PutBucketLogging
        - PutBucketMetricsConfiguration
        - PutBucketNotification
        - PutBucketNotificationConfiguration
        - PutBucketOwnershipControls
        - PutBucketPolicy
        - PutBucketReplication
        - PutBucketRequestPayment
        - PutBucketTagging
        - PutBucketVersioning
        - PutBucketWebsite
        - PutObject
        - PutObjectAcl
        - PutObjectAnnotation
        - PutObjectLegalHold
        - PutObjectLockConfiguration
        - PutObjectRetention
        - PutObjectTagging
        - PutPublicAccessBlock
        - RenameObject
        - RestoreObject
        - SelectObjectContent
        - UpdateBucketMetadataAnnotationTableConfiguration
        - UpdateBucketMetadataInventoryTableConfiguration
        - UpdateBucketMetadataJournalTableConfiguration
        - UpdateObjectEncryption
        - UploadPart
        - UploadPartCopy
    - field: interface.operations[].name
      targetKind: aws.s3
      targetType: service
      values: &service_operations
        - CreateBucket
        - ListBuckets
        - ListDirectoryBuckets
    - field: interface.operations[].name
      targetKind: aws.s3
      targetType: object_lambda
      values: &object_lambda_operations
        - WriteGetObjectResponse
    - field: interface.operations[].role
      targetKind: aws.s3
      targetType: bucket
      values: &operation_roles
        - source
        - destination

  schemas:
    - id: aws-s3-bucket-interface
      appliesToKind: aws.s3
      appliesToInterfaceType: bucket
      description: Validates an Amazon S3 bucket requirement and its canonical API operations.
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: object
        required:
          - kind
          - interface
        properties:
          kind:
            const: aws.s3
          interface:
            type: object
            required:
              - type
              - operations
            properties:
              type:
                const: bucket
              operations:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      enum: *bucket_operations
                    role:
                      enum: *operation_roles
                  additionalProperties: true
            additionalProperties: true
        additionalProperties: true

    - id: aws-s3-service-interface
      appliesToKind: aws.s3
      appliesToInterfaceType: service
      description: Validates service-level Amazon S3 access requirements.
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: object
        required:
          - kind
          - interface
        properties:
          kind:
            const: aws.s3
          interface:
            type: object
            required:
              - type
              - operations
            properties:
              type:
                const: service
              operations:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      enum: *service_operations
                  additionalProperties: true
            additionalProperties: true
        additionalProperties: true

    - id: aws-s3-object-lambda-interface
      appliesToKind: aws.s3
      appliesToInterfaceType: object_lambda
      description: Validates an Amazon S3 Object Lambda response requirement.
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: object
        required:
          - kind
          - interface
        properties:
          kind:
            const: aws.s3
          interface:
            type: object
            required:
              - type
              - operations
            properties:
              type:
                const: object_lambda
              operations:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      enum: *object_lambda_operations
                  additionalProperties: true
            additionalProperties: true
        additionalProperties: true
