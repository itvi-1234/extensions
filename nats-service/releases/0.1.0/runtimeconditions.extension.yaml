apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  id: https://runtimeconditions.io/extensions/nats-service/0.1.0/runtimeconditions.extension.yaml
  version: 0.1.0
  semanticSha256: b67877d056715d94583ecaf19a90429b31b52507399ffb3d06b0ab092f39995e
spec:
  kinds:
  - name: nats
  interfaceTypes:
  - name: service
    targetKind: nats
  interfaceFields:
  - name: operations
    targetKind: nats
    targetType: service
  fieldValues:
  - field: interface.operations[].resource
    targetKind: nats
    targetType: service
    values:
    - connection
    - subject
    - stream
    - consumer
    - key_value
    - object_store
  - field: interface.operations[].action
    targetKind: nats
    targetType: service
    values:
    - connect
    - consume
    - create
    - delete
    - inspect
    - publish
    - read
    - request
    - subscribe
    - update
    - watch
    - write
  schemas:
  - id: nats-service-interface
    appliesToKind: nats
    appliesToInterfaceType: service
    description: Validates adapter-actionable NATS connection, subject authorization, and JetStream resource requirements.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - kind
      - interface
      properties:
        kind:
          const: nats
        interface:
          type: object
          required:
          - type
          - operations
          properties:
            type:
              const: service
            operations:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                oneOf:
                - type: object
                  required:
                  - resource
                  - action
                  properties:
                    resource:
                      const: connection
                    action:
                      enum:
                      - connect
                  additionalProperties: false
                - type: object
                  required:
                  - resource
                  - action
                  - subject
                  properties:
                    resource:
                      const: subject
                    action:
                      enum:
                      - publish
                      - subscribe
                      - request
                    subject: &id001
                      type: string
                      minLength: 1
                      pattern: ^[^\s]+$
                  additionalProperties: false
                - type: object
                  required:
                  - resource
                  - action
                  - name
                  properties:
                    resource:
                      const: stream
                    action:
                      enum:
                      - create
                      - update
                      - delete
                      - inspect
                    name: &id002
                      type: string
                      minLength: 1
                      pattern: ^[^\s.*>]+$
                    subjects:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: *id001
                  additionalProperties: false
                - type: object
                  required:
                  - resource
                  - action
                  - subject
                  properties:
                    resource:
                      const: stream
                    action:
                      const: publish
                    subject: *id001
                  additionalProperties: false
                - type: object
                  required:
                  - resource
                  - action
                  - stream
                  properties:
                    resource:
                      const: consumer
                    action:
                      enum:
                      - create
                      - update
                      - delete
                      - inspect
                      - consume
                    stream: *id002
                    name: *id002
                  additionalProperties: false
                - type: object
                  required:
                  - resource
                  - action
                  - bucket
                  properties:
                    resource:
                      const: key_value
                    action:
                      enum:
                      - create
                      - delete
                      - inspect
                      - read
                      - write
                      - watch
                    bucket: *id002
                  additionalProperties: false
                - type: object
                  required:
                  - resource
                  - action
                  - bucket
                  properties:
                    resource:
                      const: object_store
                    action:
                      enum:
                      - create
                      - delete
                      - inspect
                      - read
                      - write
                      - watch
                    bucket: *id002
                  additionalProperties: false
          additionalProperties: false
      additionalProperties: true
