[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-binding-emitter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "ruff==0.16.9"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "mypy==2.3.1", "types-PyYAML==6.0.12.20260906", "jsonschema==4.26.0", "packaging==26.3", "build==1.6.1", "setuptools==84.0.0", "wheel==0.48.0", "pyproject_hooks==1.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
