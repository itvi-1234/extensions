$schema: https://json-schema.org/draft/2020-12/schema
$id: https://runtimeconditions.io/schemas/runtimeconditions.toolchain-lock.v1alpha1.schema.yaml
title: Runtime Conditions toolchain lock
description: >-
  Development may use workspace tools. A released lock pins normalizer,
  orchestrator, emitters and independently installed profilers by version and
  artifact SHA-256. Go profiler pins may instead identify a linked module by
  exact version and dependency checksum. Consumers must check that each selected
  language has an emitter and profiler and that the selected identity form,
  version and checksum match the lock without substituting another artifact kind.
type: object
additionalProperties: false
required: [apiVersion, kind, status]
properties:
  apiVersion: {const: runtimeconditions.io/toolchain-lock/v1alpha1}
  kind: {const: RuntimeConditionsToolchainLock}
  status:
    type: string
    pattern: '^(?:development|phase[0-9]+-development|released)$'
  tools:
    type: object
    additionalProperties: false
    properties:
      normalizer: {$ref: '#/$defs/toolIdentity'}
      orchestrator: {$ref: '#/$defs/toolIdentity'}
      emitters: {$ref: '#/$defs/languageTools'}
      profilers: {$ref: '#/$defs/profilerTools'}
  languages:
    type: object
    propertyNames:
      pattern: '^[a-z][a-z0-9-]*$'
    additionalProperties: {$ref: '#/$defs/languageToolchain'}
  python:
    description: Existing Python package-build tool pins, also used by the native emitter.
    type: object
    additionalProperties: false
    required: [minimumVersion, interpreterVersion, packageManager, buildBackend, tools]
    properties:
      minimumVersion: {type: string, pattern: '^[0-9]+\.[0-9]+$'}
      interpreterVersion: {$ref: '#/$defs/languageVersion'}
      packageManager: {$ref: '#/$defs/nonEmptyString'}
      buildBackend: {$ref: '#/$defs/nonEmptyString'}
      tools: {$ref: '#/$defs/nativeTools'}
allOf:
  - if:
      properties:
        status: {const: released}
    then:
      required: [tools, languages]
      properties:
        tools:
          required: [normalizer, orchestrator, emitters, profilers]
        languages: {minProperties: 1}
$defs:
  nonEmptyString: {type: string, minLength: 1}
  languageVersion: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
  toolIdentity:
    type: object
    additionalProperties: false
    required: [name, version, sha256]
    properties:
      name: {$ref: '#/$defs/nonEmptyString'}
      version: {$ref: '#/$defs/nonEmptyString'}
      sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      artifactUrl:
        description: Optional retrieval URL for the exact checksummed released artifact.
        type: string
        pattern: '^https://[^\s]+$'
  profilerIdentity:
    oneOf:
      - {$ref: '#/$defs/toolIdentity'}
      - {$ref: '#/$defs/linkedGoProfilerIdentity'}
  linkedGoProfilerIdentity:
    description: Exact linked Go profiler dependency, distinct from an executable digest.
    type: object
    additionalProperties: false
    required: [kind, name, version, module, moduleSum]
    properties:
      kind: {const: go-module}
      name: {const: go-rc-profiler}
      version:
        type: string
        pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+incompatible)?$'
      module: {const: github.com/runtimeconditions/go-rc-profiler}
      moduleSum:
        type: string
        pattern: '^h1:[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$'
  profilerTools:
    type: object
    minProperties: 1
    propertyNames:
      pattern: '^[a-z][a-z0-9-]*$'
    properties:
      go: {$ref: '#/$defs/profilerIdentity'}
    additionalProperties: {$ref: '#/$defs/toolIdentity'}
  languageTools:
    type: object
    minProperties: 1
    propertyNames:
      pattern: '^[a-z][a-z0-9-]*$'
    additionalProperties: {$ref: '#/$defs/toolIdentity'}
  nativeTools:
    type: object
    minProperties: 1
    additionalProperties: {$ref: '#/$defs/nonEmptyString'}
  languageToolchain:
    type: object
    additionalProperties: false
    required: [languageVersion, packageManager, tools]
    properties:
      languageVersion: {$ref: '#/$defs/languageVersion'}
      packageManager: {$ref: '#/$defs/nonEmptyString'}
      buildBackend: {$ref: '#/$defs/nonEmptyString'}
      tools: {$ref: '#/$defs/nativeTools'}
