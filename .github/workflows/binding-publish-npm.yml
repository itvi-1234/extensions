name: Publish TypeScript bindings

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated package-key:typescript targets, or all'
        type: string
        default: ''
      dry_run:
        description: 'Verify publication without pushing to npm'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: binding-publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Publish to npm (placeholder)
        env:
          TARGETS: ${{ inputs.targets }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "npm publication is not implemented; no package was published."
          echo "targets=${TARGETS:-<none>} dry_run=${DRY_RUN}"
