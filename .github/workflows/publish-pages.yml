name: Publish extensions site

on:
  push:
    branches:
      - main
    paths:
      - "catalog/**/releases/**/runtimeconditions.extension.yaml"
      - "tooling/common/build_extensions_site.py"
      - "tooling/common/serialization.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install prerequisites
        run: python -m pip install --disable-pip-version-check -r tooling/smithy-runtime-conditions/requirements.txt

      - name: Build the site, one path per extension's metadata.id
        run: python tooling/common/build_extensions_site.py --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
