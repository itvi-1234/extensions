name: Notify docs site of catalog changes

on:
  push:
    branches:
      - main
    paths:
      - "catalog/**/releases/**/runtimeconditions.extension.yaml"
      - "catalog/rc/common-integrations/common-integrations-v1alpha1.yaml"
      - "catalog/rc/env-configuration/env-configuration-v1alpha1.yaml"
      - "tooling/common/build_extensions_site.py"
      - "tooling/common/serialization.py"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger docs site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN }}
          repository: runtimeconditions/runtimeconditions.github.io
          event-type: extensions-updated
