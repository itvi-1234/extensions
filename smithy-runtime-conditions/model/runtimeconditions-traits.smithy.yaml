smithy: '2.0'
shapes:
  runtimeconditions.smithy#NonEmptyString:
    type: string
    traits:
      smithy.api#length:
        min: 1
  runtimeconditions.smithy#SemanticVersion:
    type: string
    traits:
      smithy.api#pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$
  runtimeconditions.smithy#ConditionTemplate:
    type: structure
    members:
      interfaceType:
        target: runtimeconditions.smithy#NonEmptyString
        traits:
          smithy.api#required: {}
      identityPath:
        target: runtimeconditions.smithy#NonEmptyString
      identityEncoding:
        target: runtimeconditions.smithy#NonEmptyString
      operationRole:
        target: runtimeconditions.smithy#NonEmptyString
      conditional:
        target: smithy.api#Boolean
        traits:
          smithy.api#default: false
  runtimeconditions.smithy#ConditionTemplateList:
    type: list
    member:
      target: runtimeconditions.smithy#ConditionTemplate
  runtimeconditions.smithy#serviceSemantics:
    type: structure
    members:
      extensionName:
        target: runtimeconditions.smithy#NonEmptyString
        traits:
          smithy.api#required: {}
      serviceKey:
        target: runtimeconditions.smithy#NonEmptyString
        traits:
          smithy.api#required: {}
      extensionVersion:
        target: runtimeconditions.smithy#SemanticVersion
        traits:
          smithy.api#required: {}
      extensionId:
        target: runtimeconditions.smithy#NonEmptyString
        traits:
          smithy.api#required: {}
      displayName:
        target: runtimeconditions.smithy#NonEmptyString
        traits:
          smithy.api#required: {}
      conditionKind:
        target: runtimeconditions.smithy#NonEmptyString
        traits:
          smithy.api#required: {}
      defaultCondition:
        target: runtimeconditions.smithy#ConditionTemplate
        traits:
          smithy.api#required: {}
      reviewedOperationCount:
        target: smithy.api#Integer
        traits:
          smithy.api#required: {}
      reviewedOperationNamesSha256:
        target: runtimeconditions.smithy#NonEmptyString
        traits:
          smithy.api#required: {}
    traits:
      smithy.api#trait:
        selector: service
  runtimeconditions.smithy#operationSemantics:
    type: structure
    members:
      primaryCondition:
        target: runtimeconditions.smithy#ConditionTemplate
      additionalConditions:
        target: runtimeconditions.smithy#ConditionTemplateList
    traits:
      smithy.api#trait:
        selector: operation
